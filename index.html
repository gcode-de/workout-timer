<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0f">
    <meta name="description" content="A simple interval timer for workouts.">
    <title>Workout Timer</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./images/icons/icon-192x192.png">
    <style>
        :root {
            color-scheme: dark;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background: #0b0c0f;
            color: #f4f4f5;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100svh;
            margin: 0;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            background: radial-gradient(circle at top, #20243a 0, #0b0c0f 42%);
        }

        main {
            width: min(100%, 440px);
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin: 12px 0 28px;
            font-size: clamp(2rem, 9vw, 3rem);
            letter-spacing: -.06em;
        }

        .settings {
            display: grid;
            gap: 10px;
            margin-bottom: 32px;
        }

        .setting {
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            min-height: 54px;
            padding: 3px;
            border: 1px solid #303442;
            border-radius: 16px;
            background: rgb(19 21 28 / 85%);
        }

        .setting-value { font-size: 1rem; }

        button {
            min-width: 44px;
            min-height: 44px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: #5965f2;
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover { background: #707af5; }
        button:focus-visible { outline: 3px solid #aeb4ff; outline-offset: 3px; }
        button:disabled { cursor: not-allowed; opacity: .35; }

        .timer-card {
            padding: 28px 22px 24px;
            border: 1px solid #303442;
            border-radius: 24px;
            background: rgb(19 21 28 / 92%);
            box-shadow: 0 24px 70px rgb(0 0 0 / 30%);
        }

        #roundCounter {
            min-height: 24px;
            color: #a9adba;
            font-size: .95rem;
        }

        #status {
            min-height: 43px;
            margin-top: 8px;
            color: #aeb4ff;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: .08em;
        }

        #timer {
            margin: 4px 0 20px;
            font-size: clamp(3.5rem, 18vw, 5.5rem);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            letter-spacing: -.08em;
            line-height: 1;
        }

        progress {
            width: 100%;
            height: 9px;
            margin-bottom: 28px;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            background: #303442;
        }

        progress::-webkit-progress-bar { background: #303442; }
        progress::-webkit-progress-value { background: #7d86ff; transition: width .2s linear; }
        progress::-moz-progress-bar { background: #7d86ff; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 132px;
            padding: 0 22px;
            font-weight: 700;
        }

        .control-button.secondary {
            min-width: 54px;
            padding: 0;
            background: #343846;
        }

        .hint {
            margin: 22px auto 0;
            color: #818694;
            font: .75rem/1.5 system-ui, sans-serif;
        }

        [hidden] { display: none !important; }
    </style>
    <script type="module" src="./app.mjs"></script>
</head>
<body>
    <main>
        <h1>Workout Timer</h1>

        <section class="settings" aria-label="Workout settings">
            <div class="setting">
                <button type="button" data-setting="workMs" data-change="-5000" aria-label="Reduce work time">−</button>
                <span id="workDuration" class="setting-value"></span>
                <button type="button" data-setting="workMs" data-change="5000" aria-label="Increase work time">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="restMs" data-change="-5000" aria-label="Reduce rest time">−</button>
                <span id="restDuration" class="setting-value"></span>
                <button type="button" data-setting="restMs" data-change="5000" aria-label="Increase rest time">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="rounds" data-change="-1" aria-label="Reduce rounds">−</button>
                <span id="rounds" class="setting-value"></span>
                <button type="button" data-setting="rounds" data-change="1" aria-label="Increase rounds">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="pauseMs" data-change="-10000" aria-label="Reduce set pause">−</button>
                <span id="pauseDuration" class="setting-value"></span>
                <button type="button" data-setting="pauseMs" data-change="10000" aria-label="Increase set pause">+</button>
            </div>
        </section>

        <section class="timer-card" aria-label="Timer">
            <div id="roundCounter" aria-live="polite"></div>
            <div id="status">READY</div>
            <div id="timer" role="timer" aria-live="off">00:00</div>
            <progress id="progress" max="1" value="0" aria-label="Interval progress"></progress>
            <div class="controls">
                <button id="primaryButton" class="control-button" type="button">
                    <span id="primaryIcon" aria-hidden="true">▶</span>
                    <span id="primaryLabel">Start</span>
                </button>
                <button id="stopButton" class="control-button secondary" type="button" aria-label="Stop and reset" hidden>■</button>
            </div>
        </section>

        <p class="hint">Rest → work for each round → set pause. The timer continues accurately when the tab is in the background.</p>
    </main>
</body>
</html>
