<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta id="themeColor" name="theme-color" content="#0b0c0f">
    <meta name="description" content="A simple interval timer for workouts.">
    <title>Workout Timer</title>
    <script>
        try {
            const savedTheme = JSON.parse(localStorage.getItem('workoutTimerPreferences'))?.theme;
            if (savedTheme === 'dark' || savedTheme === 'light') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch {}
    </script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./images/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="./images/icons/icon-192x192.png">
    <style>
        :root {
            color-scheme: dark;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --page: #0b0c0f;
            --page-glow: #20243a;
            --surface: rgb(19 21 28 / 92%);
            --surface-soft: rgb(19 21 28 / 85%);
            --border: #303442;
            --text: #f4f4f5;
            --muted: #a9adba;
            --subtle: #818694;
            --accent: #5965f2;
            --accent-hover: #707af5;
            --accent-soft: #aeb4ff;
            --secondary: #343846;
            --track: #303442;
            background: var(--page);
            color: var(--text);
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --page: #f4f5fb;
            --page-glow: #d9dcff;
            --surface: rgb(255 255 255 / 94%);
            --surface-soft: rgb(255 255 255 / 88%);
            --border: #d8dae5;
            --text: #171821;
            --muted: #5f6372;
            --subtle: #686d7d;
            --accent: #4854df;
            --accent-hover: #3541ca;
            --accent-soft: #353fab;
            --secondary: #e5e7f0;
            --track: #dfe1ea;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                color-scheme: light;
                --page: #f4f5fb;
                --page-glow: #d9dcff;
                --surface: rgb(255 255 255 / 94%);
                --surface-soft: rgb(255 255 255 / 88%);
                --border: #d8dae5;
                --text: #171821;
                --muted: #5f6372;
                --subtle: #686d7d;
                --accent: #4854df;
                --accent-hover: #3541ca;
                --accent-soft: #353fab;
                --secondary: #e5e7f0;
                --track: #dfe1ea;
            }
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100svh;
            margin: 0;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
            background: radial-gradient(circle at top, var(--page-glow) 0, var(--page) 42%);
            color: var(--text);
        }

        main {
            width: min(100%, 440px);
            margin: 0 auto;
            text-align: center;
        }

        .topbar {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            margin: 12px 0 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 9vw, 3rem);
            letter-spacing: -.06em;
        }

        .settings {
            display: grid;
            gap: 10px;
            margin-bottom: 32px;
        }

        .setting {
            display: grid;
            grid-template-columns: 48px 1fr 48px;
            align-items: center;
            min-height: 54px;
            padding: 3px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface-soft);
        }

        .setting-value { font-size: 1rem; }

        button {
            min-width: 44px;
            min-height: 44px;
            border: 0;
            border-radius: 13px;
            color: #fff;
            background: var(--accent);
            font: inherit;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover { background: var(--accent-hover); }
        button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
        button:disabled { cursor: not-allowed; opacity: .35; }

        .icon-button {
            padding: 0;
            color: var(--text);
            background: transparent;
            font-size: 1.35rem;
        }

        .icon-button:hover { background: var(--secondary); }

        .timer-card {
            padding: 28px 22px 24px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgb(0 0 0 / 30%);
        }

        #roundCounter {
            min-height: 24px;
            color: var(--muted);
            font-size: .95rem;
        }

        #status {
            min-height: 43px;
            margin-top: 8px;
            color: var(--accent-soft);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: .08em;
        }

        #timer {
            margin: 4px 0 20px;
            font-size: clamp(3.5rem, 18vw, 5.5rem);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            letter-spacing: -.08em;
            line-height: 1;
        }

        progress {
            width: 100%;
            height: 9px;
            margin-bottom: 28px;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            background: var(--track);
        }

        progress::-webkit-progress-bar { background: var(--track); }
        progress::-webkit-progress-value { background: var(--accent); transition: width .2s linear; }
        progress::-moz-progress-bar { background: var(--accent); }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 132px;
            padding: 0 22px;
            font-weight: 700;
        }

        .control-button.secondary {
            min-width: 54px;
            padding: 0;
            color: var(--text);
            background: var(--secondary);
        }

        .hint {
            margin: 22px auto 0;
            color: var(--subtle);
            font: .75rem/1.5 system-ui, sans-serif;
        }

        dialog {
            width: min(calc(100% - 32px), 420px);
            max-height: min(90svh, 720px);
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 22px;
            color: var(--text);
            background: var(--surface);
            box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
            overflow: auto;
        }

        dialog::backdrop {
            background: rgb(0 0 0 / 65%);
            backdrop-filter: blur(4px);
        }

        .dialog-content { padding: 24px; }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .dialog-header h2 { margin: 0; font-size: 1.35rem; }

        .preference-list {
            display: grid;
            gap: 4px;
        }

        .settings-section + .settings-section {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
        }

        .settings-section h3 {
            margin: 0 0 14px;
            text-align: left;
            font-size: 1rem;
        }

        .preference {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 18px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        .preference:last-child { border-bottom: 0; }
        .preference small { color: var(--subtle); font: .76rem/1.4 system-ui, sans-serif; }

        select,
        input[type="text"] {
            min-height: 40px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            background: var(--secondary);
            font: inherit;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }

        .configuration-controls,
        .configuration-save {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 8px;
        }

        .configuration-save {
            grid-template-columns: 1fr auto;
            margin-top: 10px;
        }

        .configuration-controls button,
        .configuration-save button {
            padding: 0 14px;
        }

        .configuration-message {
            min-height: 20px;
            margin: 8px 0 0;
            color: var(--subtle);
            text-align: left;
            font: .76rem/1.4 system-ui, sans-serif;
        }

        @media (max-width: 380px) {
            .configuration-controls { grid-template-columns: 1fr 1fr; }
            .configuration-controls select { grid-column: 1 / -1; }
        }

        [hidden] { display: none !important; }
    </style>
    <script type="module" src="./app.mjs"></script>
</head>
<body>
    <main>
        <header class="topbar">
            <span aria-hidden="true"></span>
            <h1>Workout Timer</h1>
            <button id="openSettingsButton" class="icon-button" type="button" aria-label="Open settings">⚙</button>
        </header>

        <section class="settings" aria-label="Workout settings">
            <div class="setting">
                <button type="button" data-setting="workMs" data-change="-5000" aria-label="Reduce work time">−</button>
                <span id="workDuration" class="setting-value"></span>
                <button type="button" data-setting="workMs" data-change="5000" aria-label="Increase work time">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="restMs" data-change="-5000" aria-label="Reduce rest time">−</button>
                <span id="restDuration" class="setting-value"></span>
                <button type="button" data-setting="restMs" data-change="5000" aria-label="Increase rest time">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="rounds" data-change="-1" aria-label="Reduce rounds">−</button>
                <span id="rounds" class="setting-value"></span>
                <button type="button" data-setting="rounds" data-change="1" aria-label="Increase rounds">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="sets" data-change="-1" aria-label="Reduce sets">−</button>
                <span id="sets" class="setting-value"></span>
                <button type="button" data-setting="sets" data-change="1" aria-label="Increase sets">+</button>
            </div>
            <div class="setting">
                <button type="button" data-setting="pauseMs" data-change="-10000" aria-label="Reduce set pause">−</button>
                <span id="pauseDuration" class="setting-value"></span>
                <button type="button" data-setting="pauseMs" data-change="10000" aria-label="Increase set pause">+</button>
            </div>
        </section>

        <section class="timer-card" aria-label="Timer">
            <div id="roundCounter" aria-live="polite"></div>
            <div id="status">READY</div>
            <div id="timer" role="timer" aria-live="off">00:00</div>
            <progress id="progress" max="1" value="0" aria-label="Interval progress"></progress>
            <div class="controls">
                <button id="primaryButton" class="control-button" type="button">
                    <span id="primaryIcon" aria-hidden="true">▶</span>
                    <span id="primaryLabel">Start</span>
                </button>
                <button id="stopButton" class="control-button secondary" type="button" aria-label="Stop and reset" hidden>■</button>
            </div>
        </section>

        <p class="hint">Rest → work for each round → set pause. The timer continues accurately when the tab is in the background.</p>
    </main>

    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
        <div class="dialog-content">
            <header class="dialog-header">
                <h2 id="settingsTitle">Settings</h2>
                <button id="closeSettingsButton" class="icon-button" type="button" aria-label="Close settings">×</button>
            </header>
            <section class="settings-section" aria-labelledby="preferencesTitle">
                <h3 id="preferencesTitle">Preferences</h3>
                <div class="preference-list">
                    <label class="preference">
                        <span>Theme</span>
                        <select id="themeSetting">
                            <option value="system">System</option>
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                        <small>Follow the device or choose a fixed appearance.</small>
                    </label>
                    <label class="preference">
                        <span>Vibration</span>
                        <input id="vibrationSetting" type="checkbox">
                        <small id="vibrationSupport">Vibrate at countdown and phase changes.</small>
                    </label>
                    <label class="preference">
                        <span>Keep screen awake</span>
                        <input id="wakeLockSetting" type="checkbox">
                        <small id="wakeLockSupport">Prevent the display from sleeping during a workout.</small>
                    </label>
                </div>
            </section>
            <section class="settings-section" aria-labelledby="configurationsTitle">
                <h3 id="configurationsTitle">Configurations</h3>
                <div class="configuration-controls">
                    <select id="configurationSelect" data-configuration-control aria-label="Saved configuration"></select>
                    <button id="loadConfigurationButton" data-configuration-control type="button">Load</button>
                    <button id="deleteConfigurationButton" data-configuration-control type="button">Delete</button>
                </div>
                <form id="saveConfigurationForm" class="configuration-save">
                    <input id="configurationName" data-configuration-control type="text" maxlength="40" required placeholder="My workout" aria-label="Configuration name">
                    <button data-configuration-control type="submit">Save current</button>
                </form>
                <p id="configurationMessage" class="configuration-message" aria-live="polite"></p>
            </section>
        </div>
    </dialog>
</body>
</html>
